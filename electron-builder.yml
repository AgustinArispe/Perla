appId: ar.com.arispe.elbocha
productName: El Bocha POS
npmRebuild: false
directories:
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**/*
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
