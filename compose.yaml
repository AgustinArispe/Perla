name: el-bocha

x-development: &development
  build:
    context: .
    target: development
  image: el-bocha-dev:local
  init: true
  working_dir: /app
  environment:
    ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    BOCHA_SKIP_ELECTRON_CHECK: '1'
    BOCHA_USE_POLLING: '1'

services:
  web:
    <<: *development
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 6
  check:
    <<: *development
    profiles: [tools]
    command: ['npm', 'run', 'check']
    volumes:
      - .:/app
      - check_node_modules:/app/node_modules

volumes:
  web_node_modules:
  check_node_modules:
